<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FN14 Coffee | Products</title>
    <meta name="description" content="Browse the FN14 Coffee menu: hot, cold and specialty coffee with fast delivery.">
    <link rel="icon" href="assets/logo/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body data-page="products">
    <div id="hdr"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <h1 class="display-4 hr">Our coffee menu</h1>
                <p class="lead hr">Search, filter and order your favourite cup.</p>
            </div>
        </section>
        <section class="py-5">
            <div class="container">
                <div class="row g-3 align-items-center mb-4">
                    <div class="col-lg-5"><label class="visually-hidden" for="q">Search coffee</label>
                        <div class="input-group input-group-lg"><span class="input-group-text"><i
                                    class="bi bi-search"></i></span><input id="q" type="search" class="form-control"
                                placeholder="Search latte, cold, caramel..."></div>
                    </div>
                    <div class="col-lg-7">
                        <div class="d-flex flex-wrap gap-2 justify-content-lg-end" id="filters" role="group"
                            aria-label="Filter by category"></div>
                    </div>
                </div>
                <p class="text-muted" id="resCount" aria-live="polite"></p>
                <div class="row g-4" id="grid"></div>
                <div id="none" class="text-center py-5 d-none">
                    <div class="empty-ic"><i class="bi bi-cup-hot"></i></div>
                    <h2 class="h3">No coffee found</h2>
                    <p class="text-muted">Try another word or pick a different category.</p><button class="btn btn-fn"
                        id="clearQ">Clear search</button>
                </div>
            </div>
        </section>
    </main>
    <div id="ftr"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
