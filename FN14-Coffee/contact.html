<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FN14 Coffee | Contact</title>
    <meta name="description" content="Contact FN14 Coffee: phone, email, opening hours and a message form.">
    <link rel="icon" href="assets/logo/logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body data-page="contact">
    <div id="hdr"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <h1 class="display-4 hr">Let's talk coffee</h1>
                <p class="lead hr">Questions, feedback or catering? We reply within a day.</p>
            </div>
        </section>
        <section class="py-5">
            <div class="container">
                <div class="row g-5">
                    <div class="col-lg-5">
                        <div class="row g-3 mb-4">
                            <div class="col-12 rv">
                                <div class="info"><i class="bi bi-telephone"></i>
                                    <div><b>Phone</b><br><a href="tel:+920000000000">+92 000 000 0000</a></div>
                                </div>
                            </div>
                            <div class="col-12 rv">
                                <div class="info"><i class="bi bi-envelope"></i>
                                    <div><b>Email</b><br><a
                                            href="mailto:hello@fn14coffee.example">hello@fn14coffee.example</a></div>
                                </div>
                            </div>
                            <div class="col-12 rv">
                                <div class="info"><i class="bi bi-geo-alt"></i>
                                    <div><b>Address</b><br>14 Roaster Lane, Your City</div>
                                </div>
                            </div>
                            <div class="col-12 rv">
                                <div class="info"><i class="bi bi-clock"></i>
                                    <div><b>Opening hours</b><br>Mon-Fri 7:00-22:00 &middot; Sat-Sun 8:00-23:00</div>
                                </div>
                            </div>
                        </div>
                        <div class="mapv rv" role="img" aria-label="Map-style illustration of the FN14 Coffee location">
                            <i class="bi bi-geo-alt-fill"></i><span>FN14 Coffee</span></div>
                    </div>
                    <div class="col-lg-7">
                        <div class="form-card rv">
                            <h2 class="h3 mb-3">Send us a message</h2>
                            <form id="contactForm" novalidate></form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="ftr"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
